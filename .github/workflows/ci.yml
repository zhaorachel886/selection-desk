name: Shiju 0.2.0-alpha.2 manual release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this release version
        shell: pwsh
        run: |
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne '0.2.0-alpha.2') { throw 'This workflow is limited to 0.2.0-alpha.2' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node demo/verify-ui.cjs
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: pwsh
        run: |
          $releasePath = 'release/0.2.0-alpha.2'
          $releaseHashes = Get-ChildItem $releasePath -File -Filter *.exe | Sort-Object Name | ForEach-Object {
            $releaseHash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            "$($releaseHash.Hash.ToLower())  $($_.Name)"
          }
          if (@($releaseHashes).Count -ne 2) { throw 'Expected installer and portable executable' }
          Set-Content -LiteralPath (Join-Path $releasePath SHA256SUMS.txt) -Value $releaseHashes -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: shiju-windows-x64-alpha
          path: |
            release/0.2.0-alpha.2/*.exe
            release/0.2.0-alpha.2/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release-alpha:
    needs: windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: shiju-release-v0.2.0-alpha.2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shiju-windows-x64-alpha
          path: release
      - name: Publish this alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.2.0-alpha.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; keeping assets unchanged.'
            exit 0
          fi
          mapfile -t files < <(find release -type f \( -name '*.exe' -o -name 'SHA256SUMS.txt' \))
          gh release create v0.2.0-alpha.2 "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title '拾句 v0.2.0-alpha.2' --prerelease \
            --notes-file docs/release-notes/0.2.0-alpha.2.md
