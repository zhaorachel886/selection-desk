name: Shiju manual alpha release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Alpha version in package.json, e.g. 0.2.0-alpha.3'
        required: true
        type: string
      publish:
        description: 'Publish a new Alpha release after checks pass'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the requested Alpha version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+-alpha\.\d+$') { throw 'Only Alpha versions are supported' }
          if ($packageVersion -ne $env:RELEASE_VERSION) { throw 'Requested version differs from package.json' }
          if (!(Test-Path "docs/release-notes/$packageVersion.md")) { throw 'Missing version release notes' }
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: node demo/verify-ui.cjs
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: shiju-windows-x64-alpha
          path: |
            release/${{ steps.version.outputs.version }}/Shiju-*.exe
            release/${{ steps.version.outputs.version }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release-alpha:
    needs: windows
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: shiju-release-${{ needs.windows.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: shiju-windows-x64-alpha
          path: release
      - name: Publish the requested Alpha
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; keeping assets unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash scripts/check-release-tag.sh "$tag" "$GITHUB_SHA"
          mapfile -t files < <(find release -type f \( -name 'Shiju-*.exe' -o -name 'SHA256SUMS.txt' \))
          gh release create "$tag" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "拾句 $tag" --prerelease \
            --notes-file "docs/release-notes/$RELEASE_VERSION.md"
